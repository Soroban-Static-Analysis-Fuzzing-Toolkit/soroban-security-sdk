[workspace]
resolver = "3"
members = [
    "crates/soroban-security-sdk",
    "crates/soroban-sec",
    "crates/soroban-sec-fuzz",
]
default-members = ["crates/soroban-security-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/soroban-security/soroban-security-sdk"
homepage = "https://github.com/soroban-security/soroban-security-sdk"
authors = ["The soroban-security-sdk Authors"]
keywords = ["soroban", "stellar", "security", "static-analysis", "audit"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
soroban-security-sdk = { path = "crates/soroban-security-sdk", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
