name: Real-world evaluation

# Runs the analyser over audited Soroban codebases at pinned commits. A detector
# change that floods real code with findings fails here before it ships; see
# docs/real-world-evaluation.md.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/soroban-security-sdk/src/**"
      - "scripts/real-world-eval.sh"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Scan the corpus
        # 109 findings at the time of writing; the headroom allows a new rule to
        # land with a handful of hits without editing this file.
        env:
          MAX_FINDINGS: "125"
        run: scripts/real-world-eval.sh | tee -a "$GITHUB_STEP_SUMMARY"
