[package]
name = "soroban-security-sdk"
description = "Developer-facing SDK for Soroban smart-contract static analysis: base detector traits, declarative macros, a typed contract model, a resource-budget estimator and a community-contributable rule registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# The built-in rule catalogue. Disable it to embed the framework with your own
# detectors only; the model, budget estimator and reporters stay available.
default = ["detectors"]
detectors = []

[dependencies]
syn = { version = "3", features = ["full", "visit", "extra-traits", "parsing", "printing", "clone-impls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
inventory = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.9"
thiserror = "2"
wasmparser = "0.259"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
wat = "1"
